<line x1="918" y1="420" x2="908.0000081492515" y2="419.9872334435751" stroke="#516577" stroke-width="1.5"/>
<line x1="56" y1="587" x2="1384" y2="587" stroke="#D5DFE6" stroke-width="1"/>
<text x="56" y="612" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">mip 与坐标在输入时已经确定；这里不计算 LOD，也不生成纹理过滤权重。</text>
