<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" role="img">
<title>Tiled地址的高低位、XOR和最终合成</title><desc>块内高位先掩码后XOR再左移八位，块内低八位单独保留，与宏块字节偏移按位或，最后加处理后的基址与mip偏移。</desc>
<defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#F3F6F9"/><path d="M-3,3 L3,-3 M0,12 L12,0 M9,15 L15,9" stroke="#D5DFE6" stroke-width="1"/></pattern></defs>
<rect width="1600" height="1420" fill="white"/>
<text x="64" y="26" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">TILED ADDRESS COMPOSITION</text>
<text x="64" y="65" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">块内高低位、XOR 与最终地址</text>
<text x="64" y="124" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">宏块偏移和块内字段先做 OR；基址与 mip 偏移经过单位转换后，再做加法。</text>
