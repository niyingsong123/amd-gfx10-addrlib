<text x="64" y="1301" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">不能再 OR 完整 blk_offset，否则可能把 XOR 清零的高位重新置 1。</text>
<text x="64" y="1349" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">本图展开 Tiled 通路；Linear 使用 micro_offset_linear 作为低位候选。</text>
<text x="64" y="1388" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">字段截取、基址清理及非零 XOR 的模式条件，按相应公式和位宽约定处理。</text>
