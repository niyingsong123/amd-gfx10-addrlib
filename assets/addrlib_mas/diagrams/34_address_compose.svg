<text x="86" y="267" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">单位：字节；拆分高于 bit7 的字段与低 8 位</text>
