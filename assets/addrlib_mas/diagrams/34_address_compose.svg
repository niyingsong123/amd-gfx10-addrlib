<text x="585" y="828" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">(swizzle_bits &lt;&lt; 8)[19:0]</text>
