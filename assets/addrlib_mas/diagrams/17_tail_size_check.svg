<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="670" viewBox="0 0 1440 670" role="img">
<title>尺寸条件：mip0 直接比较，后续 mip 看前一级块数</title><desc>y_bias 决定哪一条轴采用半块阈值；数量条件与尺寸条件共同生效。；输入、处理和输出分开显示。</desc>
<defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#F3F6F9"/><path d="M-3,3 L3,-3 M0,12 L12,0 M9,15 L15,9" stroke="#D5DFE6" stroke-width="1"/></pattern></defs>
<rect width="1440" height="670" fill="white"/>
<text x="56" y="28" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">ADDRLIB  /  MIPMAP PARAMETERS</text>
<text x="56" y="65" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">尺寸条件：mip0 直接比较，后续 mip 看前一级块数</text>
<text x="56" y="122" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">y_bias 决定哪一条轴采用半块阈值；数量条件与尺寸条件共同生效。</text>
<rect x="56" y="200" width="308" height="308" fill="#E0EDF9" stroke="#D5DFE6" stroke-width="1"/>
<rect x="56" y="200" width="308" height="5" fill="#246BB0" stroke="none" stroke-width="1"/>
<text x="78" y="225" fill="#246BB0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">输入</text>
<rect x="460" y="200" width="566" height="308" fill="#FFF0CF" stroke="#D5DFE6" stroke-width="1"/>
<rect x="460" y="200" width="566" height="5" fill="#A56A13" stroke="none" stroke-width="1"/>
<text x="482" y="225" fill="#A56A13" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">处理</text>
<rect x="1122" y="200" width="262" height="308" fill="#DEF2EF" stroke="#D5DFE6" stroke-width="1"/>
<rect x="1122" y="200" width="262" height="5" fill="#15867D" stroke="none" stroke-width="1"/>
<text x="1144" y="225" fill="#15867D" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">输出</text>
<line x1="382" y1="354" x2="441" y2="354" stroke="#516577" stroke-width="2"/>
<line x1="441" y1="354" x2="431.9955289764732" y2="358.3496553411123" stroke="#516577" stroke-width="2"/>
<line x1="441" y1="354" x2="431.9955289764732" y2="349.6503446588877" stroke="#516577" stroke-width="2"/>
<line x1="1042" y1="354" x2="1103" y2="354" stroke="#516577" stroke-width="2"/>
<line x1="1103" y1="354" x2="1093.9955289764732" y2="358.3496553411123" stroke="#516577" stroke-width="2"/>
<line x1="1103" y1="354" x2="1093.9955289764732" y2="349.6503446588877" stroke="#516577" stroke-width="2"/>
<text x="78" y="282" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">y_bias</text>
<text x="78" y="316" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">pad_sz_w / pad_sz_h</text>
<text x="78" y="350" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">W / H；Wb[m] / Hb[m]</text>
<text x="78" y="384" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">in_tail_chk</text>
<text x="482" y="280" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">① y_bias=1：块宽 × (块高/2)</text>
<text x="482" y="309" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">    y_bias=0：(块宽/2) × 块高</text>
<text x="482" y="338" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">② mip0：直接检查实际宽、高与数量条件</text>
<text x="482" y="367" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">③ 检查 mip(m+1) 时使用 Wb[m]/Hb[m]</text>
<text x="482" y="396" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">y_bias=1：Wb≤2 且 Hb≤1</text>
<text x="482" y="425" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">y_bias=0：Wb≤1 且 Hb≤2</text>
<text x="482" y="454" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">并且 in_tail_chk[m+1] 为真</text>
<text x="1144" y="282" fill="#15867D" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">in_miptail[0]</text>
<text x="1144" y="320" fill="#15867D" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">in_miptail[m+1]</text>
<line x1="56" y1="532" x2="1384" y2="532" stroke="#D5DFE6" stroke-width="1"/>
<text x="56" y="556" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">检查下一级 mip 时，读取的是前一级的块数。</text>
<text x="56" y="598" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">阈值由 pad_sz_w / pad_sz_h 得到；mip0 直接检查宽高，后续级使用前一级块数。</text>
</svg>
