<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1200" viewBox="0 0 1680 1200" role="img">
<title>同一个Z分组内的tail打包前后</title><desc>固定zb=0，mip3至10的有效数据为56054字节。假设逐级占一宏块需2MiB，共享尾区使用一个256KB宏块。</desc>
<defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#F3F6F9"/><path d="M-3,3 L3,-3 M0,12 L12,0 M9,15 L15,9" stroke="#D5DFE6" stroke-width="1"/></pattern></defs>
<rect width="1680" height="1200" fill="white"/>
<text x="64" y="26" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">MIPMAP TAIL PACKING</text>
<text x="64" y="65" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">同一个 Z 分组内，小 mip 共享尾区</text>
<text x="64" y="124" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">250×180×1537 · mip0…10 · SW_256KB_3D · 1 BPE / 1X</text>
<rect x="64" y="170" width="1552" height="62" fill="#F3F6F9" stroke="none" stroke-width="1"/>
<text x="84" y="187" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">仅比较 zb=0：各 mip 的本级 z=0…63；不足 64 层时只计有效深度。</text>
<text x="64" y="258" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">假设每一级分别占一个宏块</text>
<text x="64" y="302" fill="#A56A13" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">8 块 × 256 KB = 2 MiB</text>
