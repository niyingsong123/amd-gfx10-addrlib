<text x="64" y="1032" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">有效数据同为 56,054 B；变化的是块占用，图中左右地址条不按相同容量比例绘制。</text>
<text x="64" y="1081" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">共享条件包含尺寸和层级容量限制，不能只用有效数据量之和判断是否可进入 tail。</text>
<text x="64" y="1128" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">mip3、mip4 还在其他 Z 分组中有数据；上图不代表整条三维 tail 的总容量。</text>
<text x="64" y="1171" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">两侧方框均为 64×64 的 XY 坐标范围；地址条为宏块槽位，彩色投影不表示连续字节段。</text>
