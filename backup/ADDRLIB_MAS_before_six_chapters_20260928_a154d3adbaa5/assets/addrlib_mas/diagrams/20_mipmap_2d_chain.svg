<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img">
<title>二维 mip 链</title><desc>二维纹理逐级缩小，宽和高各减半，面积为前一级四分之一；逻辑编号不代表地址次序。</desc>
<defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#F3F6F9"/><path d="M-3,3 L3,-3 M0,12 L12,0 M9,15 L15,9" stroke="#D5DFE6" stroke-width="1"/></pattern></defs>
<rect width="1440" height="660" fill="white"/>
<text x="56" y="28" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">ADDRLIB  /  2D MIP CHAIN</text>
<text x="56" y="67" fill="#183248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">二维 mip：宽、高各减半，面积约为前一级的 1/4</text>
<text x="56" y="126" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">256×256 纹理的各级尺寸；按逻辑 mip 编号从大到小展示。</text>
<rect x="60" y="202.72000000000003" width="289.28" height="289.28" fill="#E0EDF9" stroke="#246BB0" stroke-width="1.5"/>
<text x="60" y="515" fill="#246BB0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">mip0</text>
<text x="60" y="556" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">256×256</text>
<text x="132" y="307.72" fill="#246BB0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">原始纹理</text>
<rect x="498" y="347.36" width="144.64" height="144.64" fill="#DEF2EF" stroke="#15867D" stroke-width="1.5"/>
<text x="498" y="515" fill="#15867D" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">mip1</text>
<text x="498" y="556" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">128×128</text>
<rect x="788" y="419.68" width="72.32" height="72.32" fill="#FFF0CF" stroke="#A56A13" stroke-width="1.5"/>
<text x="788" y="515" fill="#A56A13" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">mip2</text>
<text x="788" y="556" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">64×64</text>
<rect x="1000" y="455.84000000000003" width="36.16" height="36.16" fill="#EEE5FC" stroke="#7552B2" stroke-width="1.5"/>
<text x="1000" y="515" fill="#7552B2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">mip3</text>
<text x="1000" y="556" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">32×32</text>
<rect x="1150" y="473.92" width="18.08" height="18.08" fill="#FBE4EF" stroke="#BB477D" stroke-width="1.5"/>
<text x="1150" y="515" fill="#BB477D" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">mip4</text>
<text x="1150" y="556" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">16×16</text>
<rect x="1320" y="490.87" width="1.13" height="1.13" fill="#E0EDF9" stroke="#246BB0" stroke-width="1.5"/>
<text x="1320" y="515" fill="#246BB0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">mip8</text>
<text x="1320" y="556" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">1×1</text>
<text x="1241" y="467" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">…</text>
<text x="56" y="613" fill="#516577" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">二维面积约按 1/4 递减；三维纹理的体积约按 1/8 递减。内存顺序由布局算法另行决定。</text>
</svg>
